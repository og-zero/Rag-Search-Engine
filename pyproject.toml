[project]
name = "rag-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zero", email = "ZERO_BROTHER12345@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "nltk==3.9.1",
    "numpy==2.3.3",
    "openai==2.44.0",
    "pillow>=13.0.0",
    "python-dotenv==1.1.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-search-engine = "rag_search_engine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]  # Specify your actual source directories here
